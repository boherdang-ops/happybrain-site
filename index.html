<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717">
<title>박상득 | 한국공공자치연구원 AI행정혁신연구소</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap');

:root {
  --bg:#eee9df;
  --card:#f8f5ee;
  --ink:#191816;
  --muted:#6f6a61;
  --line:#d8d0c2;
  --accent:#a23b2e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(162,59,46,.08), transparent 28%),
    linear-gradient(135deg,#e9e3d8 0%,#f5f1e8 52%,#e7e0d4 100%);
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}
.card{
  width:min(100%,430px);
  background:rgba(248,245,238,.96);
  border:1px solid rgba(25,24,22,.13);
  box-shadow:0 24px 70px rgba(35,30,22,.15);
  border-radius:22px;
  overflow:hidden;
  position:relative;
}
.topbar{
  height:7px;
  background:var(--ink);
}
.inner{padding:34px 30px 28px}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:28px;
}
.logo{height:25px;width:auto;max-width:100%;display:block}
.rule{height:1px;background:var(--line);margin:25px 0}
.name{
  font-family:"Noto Serif KR",serif;
  font-size:34px;
  font-weight:700;
  letter-spacing:.08em;
  line-height:1.2;
}
.org{
  margin-top:10px;
  font-size:14px;
  color:var(--muted);
  line-height:1.6;
}
.role{
  display:inline-block;
  margin-top:10px;
  padding:5px 10px;
  border:1px solid rgba(162,59,46,.3);
  border-radius:999px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}
.info{display:grid;gap:0}
.item{
  display:grid;
  grid-template-columns:58px 1fr 22px;
  align-items:center;
  gap:8px;
  min-height:57px;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:inherit;
}
.item:last-child{border-bottom:0}
.label{font-size:11px;color:#999187;letter-spacing:.04em}
.value{font-size:14px;font-weight:600;line-height:1.5;word-break:keep-all}
.icon{font-size:15px;color:#aaa39a;text-align:right}
.address{align-items:start;padding:12px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{
  border:0;border-radius:12px;padding:14px 10px;
  font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  text-align:center;text-decoration:none;
}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.secondary{background:#e8e1d5;color:var(--ink)}
.note{margin-top:18px;text-align:center;font-size:11px;color:#9a9388}
.toast{
  position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);
  background:#191816;color:#fff;padding:11px 17px;border-radius:999px;
  font-size:12px;opacity:0;pointer-events:none;transition:.25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){
  .inner{padding:28px 22px 24px}
  .name{font-size:30px}
  .value{font-size:13px}
}
</style>
</head>
