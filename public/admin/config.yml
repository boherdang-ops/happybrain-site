backend:
  name: github
  repo: boherdang-ops/happybrain-site
  branch: main
media_folder: public/uploads
public_folder: /uploads
locale: ko
collections:
  - name: home_page
    label: 01 · 첫 화면
    description: 첫 화면의 제목 → 사업 → 서비스 → 교육 → 진행 방법 순서입니다. 인사이트 제목·소개도 사업·서비스 항목에 있습니다.
    editor:
      preview: false
    files:
      - name: home
        label: 법인 홈페이지 · 첫 화면
        file: src/data/home.json
        fields:
          - name: heroEyebrow
            label: 첫 화면 기관명
            widget: string
          - name: heroTitle
            label: 큰 제목 (줄바꿈은 Enter로)
            widget: text
          - name: heroLead
            label: 제목 아래 설명 문구
            widget: text
        preview_path: /
      - name: corporate
        label: 사업·서비스·교육 요약·진행 방법
        file: src/data/corporate.json
        fields:
          - name: businessTitle
            label: 사업 영역 제목
            widget: text
          - name: businessIntro
            label: 사업 영역 소개
            widget: text
          - name: servicesTitle
            label: 서비스 연결 제목
            widget: text
          - name: servicesIntro
            label: 서비스 연결 소개
            widget: text
          - name: services
            label: 서비스 연결
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: key
                label: 식별자 (education / learning / practice)
                widget: hidden
              - name: title
                label: 서비스 이름
                widget: string
              - name: desc
                label: 짧은 소개
                widget: text
              - name: detail
                label: 상세 소개
                widget: text
              - name: label
                label: 버튼 이름
                widget: string
              - name: url
                label: 연결 주소
                widget: string
            min: 4
            max: 4
            hint: 교육 안내·역량진단·Learning Hub·실무지원의 네 연결을 관리합니다. 상세 자료는 각 사이트에서 수정하세요.
          - name: coursesTitle
            label: 교육과정 제목
            widget: text
          - name: coursesIntro
            label: 교육과정 소개
            widget: text
          - name: courses
            label: 교육과정 요약 (최신 교육안내와 함께 확인)
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: 과정명
                widget: string
              - name: target
                label: 교육대상
                widget: string
              - name: duration
                label: 시간
                widget: string
              - name: url
                label: 과정 안내 주소
                widget: string
          - name: approachTitle
            label: 진행 방법 제목
            widget: text
          - name: approachIntro
            label: 진행 방법 소개
            widget: text
          - name: steps
            label: 협의 진행 단계
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: 단계명
                widget: string
              - name: body
                label: 설명
                widget: text
          - name: insightsTitle
            label: 자료·인사이트 제목
            widget: text
          - name: insightsIntro
            label: 자료·인사이트 소개
            widget: text
        description: 홈 화면 순서대로 편집합니다. 서비스 연결은 상단 메뉴와 법인 소개에도 함께 반영됩니다.
        preview_path: /
      - name: display_home
        label: 첫 화면 · 버튼과 하단 연결
        file: src/data/display-home.json
        fields:
          - name: inquiryLabel
            label: 문의 버튼 이름
            widget: string
          - name: inquiryUrl
            label: 문의 버튼 주소
            widget: string
          - name: servicesLabel
            label: 서비스 이동 버튼
            widget: string
          - name: aboutLabel
            label: 법인 소개 버튼
            widget: string
          - name: coursesLabel
            label: 전체 교육과정 버튼
            widget: string
          - name: newsTitle
            label: 공지·소식 제목
            widget: text
          - name: newsIntro
            label: 공지·소식 소개
            widget: string
          - name: newsMore
            label: 전체 소식 버튼
            widget: string
          - name: insightsMore
            label: 전체 인사이트 버튼
            widget: string
          - name: resourceLinks
            label: 하단 자료 연결 (추가·삭제·순서 변경)
            widget: list
            summary: '{{fields.label}}'
            fields:
              - name: label
                label: 연결 이름
                widget: string
              - name: url
                label: 연결 주소
                widget: string
          - name: businessEyebrow
            label: 사업 영역 작은 윗줄
            widget: string
          - name: servicesEyebrow
            label: 서비스 작은 윗줄
            widget: string
          - name: educationEyebrow
            label: 교육 작은 윗줄
            widget: string
          - name: approachEyebrow
            label: 진행 방법 작은 윗줄
            widget: string
          - name: newsEyebrow
            label: 공지·소식 작은 윗줄
            widget: string
          - name: insightsEyebrow
            label: 인사이트 작은 윗줄
            widget: string
        preview_path: /
  - name: about_page
    label: 02 · 법인 소개
    description: 기관명·소개·사업 영역은 공통 정보에서, 연결 서비스는 첫 화면에서 관리합니다.
    editor:
      preview: false
    files:
      - name: about
        label: 대표 인사말 · 본문과 서명
        file: src/data/about.json
        fields:
          - name: name
            label: 서명 이름 (별도 서명이 없을 때)
            widget: string
          - name: greeting
            label: 인사말 (문단은 Enter로 구분)
            widget: text
            required: false
          - name: signTitle
            label: '인사말 서명 - 직함 (예: 대표이사)'
            widget: string
            required: false
          - name: signName
            label: 인사말 서명 - 이름
            widget: string
            required: false
        preview_path: /about/
      - name: display_about
        label: 법인 소개 · 화면 제목
        file: src/data/display-about.json
        fields:
          - name: title
            label: 페이지 이름
            widget: string
          - name: servicesTitle
            label: 사업 영역 제목
            widget: text
          - name: greetingTitle
            label: 대표 인사말 제목
            widget: text
          - name: connectedTitle
            label: 연결 서비스 제목
            widget: text
          - name: eyebrow
            label: 상단 작은 윗줄
            widget: string
          - name: servicesEyebrow
            label: 사업 영역 작은 윗줄
            widget: string
          - name: greetingEyebrow
            label: 인사말 작은 윗줄
            widget: string
          - name: connectedEyebrow
            label: 서비스 작은 윗줄
            widget: string
        preview_path: /about/
  - name: contact_page
    label: 03 · 사업 문의
    description: 대표 이메일·전화는 공통 정보에서 수정합니다. 질문 접수·메일 발송 설정은 유지됩니다.
    editor:
      preview: false
    files:
      - name: contact
        label: Q&A · 질문과 답변
        file: src/data/contact.json
        fields:
          - name: faqs
            label: Q&A · 자주 묻는 질문
            widget: list
            required: false
            summary: '{{fields.question}}'
            fields:
              - name: question
                label: 질문
                widget: string
              - name: answer
                label: 답변
                widget: text
              - name: linkLabel
                label: 관련 링크 이름 (선택)
                widget: string
                required: false
              - name: link
                label: 관련 주소 (선택)
                widget: string
                required: false
          - name: note
            label: 교육 문의 이메일 아래 안내
            widget: text
        preview_path: /contact/
      - name: display_contact
        label: 사업 문의 · 제목과 질문하기
        file: src/data/display-contact.json
        fields:
          - name: title
            label: 페이지 이름
            widget: string
          - name: intro
            label: 상단 소개
            widget: text
          - name: educationTitle
            label: 교육 문의 제목
            widget: text
          - name: guideTitle
            label: 문의 준비 안내 제목
            widget: text
          - name: guideItems
            label: 문의 시 알려줄 항목
            widget: list
            field:
              name: item
              label: 항목
              widget: string
          - name: faqTitle
            label: Q&A 제목
            widget: text
          - name: questionLabel
            label: 질문하기 버튼·제목
            widget: string
          - name: questionIntro
            label: 질문 입력 안내
            widget: string
          - name: questionPlaceholder
            label: 문의 내용 입력 예시
            widget: string
          - name: sendLabel
            label: 전송 버튼
            widget: string
          - name: eyebrow
            label: 상단 작은 윗줄
            widget: string
          - name: educationEyebrow
            label: 교육 문의 작은 윗줄
            widget: string
          - name: faqEyebrow
            label: 자주 묻는 질문 작은 윗줄
            widget: string
        preview_path: /contact/
  - name: section_pages
    label: 04 · 각 페이지 상단 소개
    description: 각 페이지 상단 제목과 설명을 수정합니다. 게시글은 아래 콘텐츠 메뉴에서 작성하세요.
    editor:
      preview: false
    files:
      - name: display_insights
        label: 인사이트 · 상단 소개
        file: src/data/display-insights.json
        fields:
          - name: title
            label: 페이지 이름
            widget: string
          - name: eyebrow
            label: 작은 윗줄
            widget: string
          - name: heading
            label: 큰 제목
            widget: text
          - name: intro
            label: 상단 소개
            widget: text
        preview_path: /writing/
      - name: display_news
        label: 공지·소식 · 상단 소개
        file: src/data/display-news.json
        fields:
          - name: title
            label: 페이지 이름
            widget: string
          - name: intro
            label: 상단 소개
            widget: text
          - name: eyebrow
            label: 작은 윗줄
            widget: string
        preview_path: /news/
      - name: display_resources
        label: 교육 자료실 · 상단 소개
        file: src/data/display-resources.json
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: eyebrow
            label: 작은 윗줄
            widget: string
          - name: intro
            label: 상단 소개
            widget: text
          - name: hubTitle
            label: Learning Hub 연결 제목
            widget: string
          - name: hubIntro
            label: Learning Hub 소개
            widget: text
          - name: hubLabel
            label: Learning Hub 버튼
            widget: string
          - name: hubUrl
            label: Learning Hub 연결 주소
            widget: string
        preview_path: /resources/
      - name: display_videos
        label: 영상 · 상단 소개
        file: src/data/display-videos.json
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: eyebrow
            label: 작은 윗줄
            widget: string
          - name: intro
            label: 상단 소개
            widget: text
        preview_path: /videos/
      - name: display_apps
        label: 기존 행정지원앱 · 상단 소개
        file: src/data/display-apps.json
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: eyebrow
            label: 작은 윗줄
            widget: string
          - name: intro
            label: 상단 소개
            widget: text
        preview_path: /apps/
  - name: common
    label: 05 · 공통 정보
    description: 법인 연락처·사업 영역·로고·메뉴·공통 푸터·알림 배너
    editor:
      preview: false
    files:
      - name: org
        label: 법인 정보 · 연락처·사업 영역·검색 정보
        file: src/data/org.json
        fields:
          - name: siteName
            label: '검색 노출용 사이트 이름 (예: AI행정혁신연구소)'
            widget: string
            required: false
          - name: siteTagline
            label: '검색 결과 제목 (예: 한국공공자치연구원 AI행정혁신연구소)'
            widget: string
            required: false
          - name: siteDescription
            label: 검색 결과 설명문 (2~3줄)
            widget: text
            required: false
          - name: name
            label: 법인/기관 정식 명칭
            widget: string
          - name: shortName
            label: 상단 로고 옆 짧은 기관명
            widget: string
          - name: mission
            label: 첫 화면·법인 소개 공통 슬로건
            widget: string
            required: false
          - name: intro
            label: 기관 소개
            widget: text
          - name: services
            label: 사업 영역 (홈·법인소개 공통)
            widget: list
            required: false
            fields:
              - name: title
                label: 제목
                widget: string
              - name: body
                label: 설명
                widget: text
          - name: ceo
            label: 대표자
            widget: string
            required: false
          - name: bizNumber
            label: 사업자등록번호
            widget: string
            required: false
          - name: address
            label: 주소
            widget: string
            required: false
          - name: phone
            label: 대표 전화
            widget: string
            required: false
          - name: email
            label: 대표 이메일
            widget: string
            required: false
        preview_path: /
      - name: footer
        label: 공통 푸터 · 제목과 설명
        file: src/data/footer.json
        fields:
          - name: ctaTitle
            label: 푸터 제목
            widget: text
          - name: ctaBody
            label: 푸터 설명
            widget: text
        preview_path: /
      - name: display_common
        label: 상단 메뉴·로고·푸터 표기
        file: src/data/display-common.json
        fields:
          - name: brandParent
            label: 로고 위 기관명
            widget: string
          - name: brandImage
            label: 로고 이미지
            widget: image
          - name: brandImageAlt
            label: 로고 대체 설명
            widget: string
          - name: footerEyebrow
            label: 푸터 작은 윗줄
            widget: string
          - name: footerTagline
            label: 푸터 맨 아래 문구
            widget: string
          - name: navAbout
            label: 법인 소개 메뉴
            widget: string
          - name: navBusiness
            label: 사업 영역 메뉴
            widget: string
          - name: navNews
            label: 공지·소식 메뉴
            widget: string
          - name: navInsights
            label: 인사이트 메뉴
            widget: string
          - name: navContact
            label: 사업 문의 메뉴
            widget: string
        preview_path: /
      - name: banner
        label: 알림 배너 (표시·기간 설정)
        file: src/data/banner.json
        fields:
          - name: enabled
            label: 배너 표시
            widget: boolean
            default: false
          - name: title
            label: 배너 제목 (표시 시 필수)
            widget: string
            required: false
          - name: description
            label: 설명
            widget: text
            required: false
          - name: image
            label: 배너 이미지 (선택)
            widget: image
            required: false
          - name: imageAlt
            label: 이미지 설명
            widget: string
            required: false
          - name: link
            label: 이동 주소 (https:// 또는 /news/ 등)
            widget: string
            required: false
          - name: linkLabel
            label: 링크 이름
            widget: string
            required: false
          - name: startDate
            label: 시작일 (한국시간, 비우면 즉시)
            widget: datetime
            date_format: YYYY-MM-DD
            time_format: false
            format: YYYY-MM-DD
            required: false
          - name: endDate
            label: 종료일 (한국시간, 해당일 포함 / 비우면 계속)
            widget: datetime
            date_format: YYYY-MM-DD
            time_format: false
            format: YYYY-MM-DD
            required: false
          - name: dismissible
            label: 방문자 닫기 허용 (브라우저 탭 동안)
            widget: boolean
            default: true
        preview_path: /
  - name: notices
    label: 콘텐츠 · 공지·소식
    label_singular: 게시글
    folder: src/content/notices
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} · {{category}}'
    fields:
      - name: title
        label: 제목
        widget: string
      - name: date
        label: 게시일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: category
        label: 분류
        widget: select
        options:
          - 공지
          - 홍보
          - AI 정책
          - 교육 정보
        default: 공지
      - name: summary
        label: 요약
        widget: text
        required: false
      - name: pinned
        label: 상단 고정
        widget: boolean
        default: false
      - name: draft
        label: 초안 (켜면 공개되지 않음)
        widget: boolean
        default: true
      - name: sourceLabel
        label: 출처 이름
        widget: string
        required: false
      - name: sourceUrl
        label: 출처 주소 (https://)
        widget: string
        required: false
      - name: attachments
        label: 첨부자료 (공개 게시용)
        widget: list
        required: false
        fields:
          - name: label
            label: 자료 이름
            widget: string
          - name: file
            label: 첨부파일 또는 외부 자료 주소
            widget: file
      - name: body
        label: 본문
        widget: markdown
    preview_path: /news/{{slug}}/
  - name: resources
    label: 콘텐츠 · 교육 자료실
    label_singular: 자료
    folder: src/content/resources
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: 자료명
        widget: string
      - name: category
        label: 분류
        widget: select
        options:
          - 강의자료
          - 프롬프트 모음
          - 실습문제
          - 워크시트
          - 현장 사진
          - 기타
        default: 강의자료
      - name: summary
        label: 설명
        widget: text
        required: false
      - name: file
        label: 자료 파일 (PDF·이미지는 미리보기 지원)
        widget: file
        required: false
      - name: fileLabel
        label: '파일 안내 (예: PDF · 2.4MB)'
        widget: string
        required: false
      - name: allowDownload
        label: 내려받기 허용 (끄면 화면 열람만 가능)
        widget: boolean
        default: false
      - name: protectedFile
        label: 보호 자료 — 공용 암호
        widget: file
        required: false
        media_folder: /public/uploads/private
        public_folder: /uploads/private
      - name: learningFile
        label: 학습 자료 — 학습 암호
        widget: file
        required: false
        media_folder: /public/uploads/learning
        public_folder: /uploads/learning
      - name: practiceFile
        label: 실습 자료 — 실습 암호
        widget: file
        required: false
        media_folder: /public/uploads/practice
        public_folder: /uploads/practice
