backend:
  name: github
  repo: boherdang-ops/happybrain-site
  branch: main
media_folder: public/uploads
public_folder: /uploads
locale: ko
collections:
  - name: courses
    label: 구버전 · 교육과정
    label_singular: 과정
    folder: src/content/courses
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: 과정명
        widget: string
      - name: summary
        label: 한 줄 소개
        widget: text
        required: false
      - name: target
        label: 교육 대상
        widget: string
        required: false
      - name: duration
        label: '소요 시간 (예: 14시간 / 1박2일)'
        widget: string
        required: false
      - name: format
        label: '교육 형식 (예: 집합·방문)'
        widget: string
        required: false
      - name: objectives
        label: 교육 목표 (여러 개)
        widget: list
        field:
          name: item
          label: 목표
          widget: string
        required: false
      - name: curriculum
        label: 커리큘럼 (회차별)
        widget: list
        required: false
        fields:
          - name: session
            label: '회차/차시 (예: 1회차)'
            widget: string
            required: false
          - name: title
            label: 제목
            widget: string
            required: false
          - name: detail
            label: 내용
            widget: text
            required: false
      - name: outcome
        label: 기대 효과
        widget: text
        required: false
      - name: gallery
        label: 교육 현장 사진
        widget: list
        required: false
        fields:
          - name: image
            label: 사진
            widget: image
          - name: caption
            label: 사진 설명
            widget: string
            required: false
      - name: thumbnail
        label: 대표 이미지
        widget: image
        required: false
      - name: order
        label: 정렬 순서 (작을수록 먼저)
        widget: number
        default: 0
        value_type: int
      - name: draft
        label: 임시저장(공개 안 함)
        widget: boolean
        default: false
      - name: body
        label: 과정 소개 (본문)
        widget: markdown
  - name: books
    label: 구버전 · 책
    label_singular: 책
    folder: src/content/books
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: 제목
        widget: string
      - name: status
        label: 상태
        widget: select
        options:
          - 출간
          - 집필 중
          - 기획 중
        default: 출간
      - name: year
        label: 연도
        widget: string
        required: false
      - name: cover
        label: 표지 이미지
        widget: image
        required: false
      - name: link
        label: 구매/소개 링크
        widget: string
        required: false
      - name: order
        label: 정렬 순서 (작을수록 먼저)
        widget: number
        default: 0
        value_type: int
      - name: body
        label: 소개글
        widget: markdown
  - name: legacy_pages
    label: 구버전 · 구버전 소개·채널
    description: 구버전 보관용입니다. 현재 법인 홈페이지에는 반영되지 않습니다.
    editor:
      preview: false
    files:
      - name: about
        label: 이전 소개·개인 이력 (개편 전 보관본)
        file: src/data/legacy/20261015-about.json
        fields:
          - name: name
            label: 이름
            widget: string
          - name: penName
            label: 직함
            widget: string
          - name: intro
            label: 소개 문단
            widget: text
          - name: greeting
            label: 인사말 (문단은 Enter로 구분)
            widget: text
            required: false
          - name: signTitle
            label: '인사말 서명 - 직함 (예: 대표이사)'
            widget: string
            required: false
          - name: signName
            label: 인사말 서명 - 이름
            widget: string
            required: false
          - name: homeHeading
            label: 과거 홈 소개 제목 (현재 홈페이지에는 미표시)
            widget: string
            required: false
          - name: homeSummary
            label: 과거 홈 소개 문단 (현재 홈페이지에는 미표시)
            widget: text
            required: false
          - name: focus
            label: 과거 하는 일 (현재 홈페이지에는 미표시)
            widget: list
            fields:
              - name: title
                label: 제목
                widget: string
              - name: body
                label: 설명
                widget: text
          - name: career
            label: 과거 기록 (현재 법인소개에는 미표시)
            widget: list
            fields:
              - name: period
                label: '시기 (예: 현재 / 이전)'
                widget: string
              - name: role
                label: 내용
                widget: string
          - name: ctaHeading
            label: 과거 문의 제목 (현재 법인소개 미표시)
            widget: string
          - name: ctaBody
            label: 과거 문의 설명 (현재 법인소개 미표시)
            widget: string
      - name: contact
        label: 이전 문의·채널 (개편 전 보관본)
        file: src/data/legacy/20261015-contact.json
        fields:
          - name: inquirySubject
            label: 교육 문의 메일 제목
            widget: string
            required: false
          - name: faqs
            label: Q&A · 자주 묻는 질문
            widget: list
            required: false
            summary: '{{fields.question}}'
            fields:
              - name: question
                label: 질문
                widget: string
              - name: answer
                label: 답변
                widget: text
              - name: linkLabel
                label: 관련 링크 이름 (선택)
                widget: string
                required: false
              - name: link
                label: 관련 주소 (선택)
                widget: string
                required: false
          - name: email
            label: 이전 문의 이메일 (현재는 법인 정보의 대표 이메일 사용)
            widget: string
          - name: note
            label: 안내 문구
            widget: text
      - name: site
        label: 사이트 설정 (채널 링크)
        file: src/data/site.json
        fields:
          - name: footerName
            label: 하단 보조 이름
            widget: string
          - name: footerTagline
            label: 맨 아래 소개 문구 (줄바꿈은 Enter로)
            widget: text
          - name: channels
            label: 채널 링크 (맨 아래 푸터·연락처에 함께 반영)
            widget: list
            fields:
              - name: label
                label: '이름 (예: 유튜브)'
                widget: string
              - name: href
                label: 링크 주소 (내 채널 주소)
                widget: string
      - name: snapshot_corporate
        label: 개편 전 보관본 · 법인 홈페이지 · 사업과 서비스
        file: src/data/legacy/20261015-corporate.json
        fields:
          - name: businessTitle
            label: 사업 영역 제목
            widget: text
          - name: businessIntro
            label: 사업 영역 소개
            widget: text
          - name: servicesTitle
            label: 서비스 연결 제목
            widget: text
          - name: servicesIntro
            label: 서비스 연결 소개
            widget: text
          - name: services
            label: 서비스 연결
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: key
                label: 식별자 (education / learning / practice)
                widget: string
              - name: eyebrow
                label: 영문 표기
                widget: string
              - name: title
                label: 서비스 이름
                widget: string
              - name: desc
                label: 짧은 소개
                widget: text
              - name: detail
                label: 상세 소개
                widget: text
              - name: label
                label: 버튼 이름
                widget: string
              - name: url
                label: 연결 주소
                widget: string
          - name: coursesTitle
            label: 교육과정 제목
            widget: text
          - name: coursesIntro
            label: 교육과정 소개
            widget: text
          - name: courses
            label: 교육과정 요약 (최신 교육안내와 함께 확인)
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: 과정명
                widget: string
              - name: target
                label: 교육대상
                widget: string
              - name: duration
                label: 시간
                widget: string
              - name: url
                label: 과정 안내 주소
                widget: string
          - name: approachTitle
            label: 진행 방법 제목
            widget: text
          - name: approachIntro
            label: 진행 방법 소개
            widget: text
          - name: steps
            label: 협의 진행 단계
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: 단계명
                widget: string
              - name: body
                label: 설명
                widget: text
          - name: insightsTitle
            label: 자료·인사이트 제목
            widget: text
          - name: insightsIntro
            label: 자료·인사이트 소개
            widget: text
          - name: ctaTitle
            label: 공통 푸터 제목
            widget: text
          - name: ctaBody
            label: 공통 푸터 설명
            widget: text
      - name: snapshot_home
        label: 개편 전 보관본 · 법인 홈페이지 · 첫 화면
        file: src/data/legacy/20261015-home.json
        fields:
          - name: heroEyebrow
            label: 첫 화면 기관명
            widget: string
          - name: heroTitle
            label: 큰 제목 (줄바꿈은 Enter로)
            widget: text
          - name: heroLead
            label: 제목 아래 설명 문구
            widget: text
      - name: snapshot_org
        label: 개편 전 보관본 · 법인 정보 (소개·푸터에 반영)
        file: src/data/legacy/20261015-org.json
        fields:
          - name: siteName
            label: '검색 노출용 사이트 이름 (예: AI행정혁신연구소)'
            widget: string
            required: false
          - name: siteTagline
            label: '검색 결과 제목 (예: 한국공공자치연구원 AI행정혁신연구소)'
            widget: string
            required: false
          - name: siteDescription
            label: 검색 결과 설명문 (2~3줄)
            widget: text
            required: false
          - name: name
            label: 법인/기관 정식 명칭
            widget: string
          - name: shortName
            label: 짧은 이름 (푸터 표기)
            widget: string
          - name: mission
            label: 한 줄 슬로건
            widget: string
            required: false
          - name: intro
            label: 기관 소개
            widget: text
          - name: services
            label: 사업 영역 (홈·법인소개 공통)
            widget: list
            required: false
            fields:
              - name: title
                label: 제목
                widget: string
              - name: body
                label: 설명
                widget: text
          - name: ceo
            label: 대표자
            widget: string
            required: false
          - name: bizNumber
            label: 사업자등록번호
            widget: string
            required: false
          - name: address
            label: 주소
            widget: string
            required: false
          - name: phone
            label: 대표 전화
            widget: string
            required: false
          - name: email
            label: 대표 이메일
            widget: string
            required: false
site_url: https://happybrain.ai.kr
display_url: https://happybrain.ai.kr/admin/guide.html
