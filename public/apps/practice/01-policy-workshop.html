<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 저작물 명칭: AI 정책 워크숍 실습기 (v1.0)
     파일명: 01-policy-workshop.html
     사용 과정: 01 최고위 정책 워크숍
     저작권자: (주)한국공공자치연구원 AI행정혁신연구소 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 정책 워크숍 실습기 v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF;
  --navy:#16305C; --navy-2:#37507A; --seal:#A8261F;
  --ink:#171A1F; --ink-3:#5B6270;
  --rule:#C9CFD8; --rule-2:#E2E6EB;
  --serif:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
  --sans:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.72;padding-bottom:132px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

header{background:var(--navy);color:#fff;padding:20px 0 16px;border-bottom:4px solid var(--seal)}
header .eyebrow{font-size:11.5px;letter-spacing:.28em;opacity:.72;margin-bottom:7px}
header h1{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.4;margin:0;letter-spacing:-.01em}
header .sub{font-size:12.5px;opacity:.75;margin-top:6px}
.steps{display:flex;gap:4px;margin-top:16px}
.steps i{flex:1;height:4px;background:rgba(255,255,255,.22);border-radius:2px;transition:background .35s ease}
.steps i.on{background:#fff}
.steps i.done{background:rgba(255,255,255,.62)}

main{padding:26px 0 8px}
.stage{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}

.tag{display:inline-block;font-family:var(--serif);font-weight:700;font-size:12px;
  letter-spacing:.16em;color:var(--seal);border:1px solid var(--seal);
  border-radius:2px;padding:2px 9px;margin-bottom:12px}
h2.title{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.42;
  margin:0 0 6px;letter-spacing:-.02em;color:var(--navy)}
h2.title .sm{color:var(--seal);font-size:19px}
.time{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:18px}
p.lead{margin:0 0 16px;color:#2A2F38}
.hr{height:1px;background:var(--rule);margin:22px 0}

.panel{background:var(--card);border:1px solid var(--rule-2);border-radius:3px;padding:18px 17px;margin:16px 0}
.panel h3{font-family:var(--serif);font-size:15.5px;margin:0 0 10px;color:var(--navy);font-weight:700}
.panel p{margin:0 0 10px;font-size:15px}
.panel p:last-child{margin-bottom:0}
.panel .cap{color:var(--ink-3);font-size:13.5px;line-height:1.65}

ol.list,ul.list{margin:0;padding-left:0;list-style:none}
ol.list li,ul.list li{position:relative;padding-left:24px;margin-bottom:11px;font-size:15px;line-height:1.68}
ol.list{counter-reset:n}
ol.list li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:.28em;
  font-family:var(--serif);font-weight:700;font-size:12px;color:var(--seal);
  width:16px;height:16px;line-height:16px;text-align:center;border:1px solid var(--seal);border-radius:50%}
ul.list li::before{content:"";position:absolute;left:5px;top:.72em;width:5px;height:5px;background:var(--navy-2);border-radius:50%}

label.field{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 7px;letter-spacing:.02em}
.hint{font-size:12.5px;color:var(--ink-3);margin:-3px 0 8px;line-height:1.6}
textarea,input[type=text]{width:100%;font-family:var(--sans);font-size:16px;line-height:1.6;
  color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 13px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
textarea::placeholder,input::placeholder{color:#9AA1AC}
textarea.script{font-size:14px;line-height:1.72;background:#FBFBFC}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.01em;
  padding:13px 16px;border-radius:3px;border:1px solid var(--navy);
  background:var(--navy);color:#fff;cursor:pointer;width:100%;
  transition:background .18s ease,transform .1s ease}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:rgba(22,48,92,.06)}
.btn.small{font-size:13.5px;padding:10px 12px}
.btn.tiny{font-size:12.5px;padding:9px 8px;font-weight:500}
.row{display:flex;gap:8px;margin-top:11px}
.row .btn{flex:1}
.copied{font-size:12.5px;color:var(--seal);font-weight:700;margin-top:9px;opacity:0;transition:opacity .2s ease}
.copied.show{opacity:1}
.openrow{margin-top:9px}
.openrow .lbl{font-size:12px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.02em}

.doc{background:#FBFBFC;border:1px solid var(--rule);border-left:3px solid var(--navy-2);
  padding:15px;font-size:14px;line-height:1.82;color:#2A2F38;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;border-radius:2px}

.pick{display:block;background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:12px 13px;margin-bottom:8px;font-size:14.5px;line-height:1.62;cursor:pointer}
.pick.sel{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal);background:#FEFAFA}
.pick .src{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--navy-2);margin-bottom:4px}
.pick.sel .src{color:var(--seal)}

.cardbox{background:var(--card);border:1px solid var(--navy);border-radius:2px;overflow:hidden;margin:18px 0 8px}
.cardbox .head{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cardbox .head strong{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.02em}
.cardbox .head span{font-size:11px;opacity:.72;letter-spacing:.1em}
.cardbox .body{padding:6px 16px 16px}
.slot{border-bottom:1px solid var(--rule-2);padding:13px 0}
.slot:last-child{border-bottom:none}
.slot .k{font-size:11.5px;font-weight:700;color:var(--navy-2);letter-spacing:.08em;margin-bottom:5px}
.slot .v{font-size:15px;line-height:1.66;white-space:pre-wrap;word-break:break-word}
.slot .v.empty{color:#AEB4BD}
.seal-mark{display:inline-block;border:2px solid var(--seal);color:var(--seal);
  font-family:var(--serif);font-weight:700;font-size:11px;letter-spacing:.1em;
  padding:5px 8px;border-radius:2px;transform:rotate(-6deg)}

.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(237,239,242,.97);
  border-top:1px solid var(--rule);backdrop-filter:saturate(1.4) blur(6px);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom));z-index:20}
.dock .wrap{display:flex;gap:9px;align-items:center}
.dock .btn{flex:1}
.dock .back{flex:0 0 auto;width:52px;background:transparent;border:1px solid var(--rule);color:var(--ink-3);font-size:19px;padding:12px 0}
.note{font-size:12px;color:var(--ink-3);text-align:center;margin-top:8px;line-height:1.6}
.warn{background:#FDF6F5;border:1px solid #E8C9C6;border-radius:3px;padding:13px 14px;
  font-size:13.5px;color:#7A211C;line-height:1.68;margin:16px 0}
.warn b{color:var(--seal)}
footer{padding:26px 0 8px;font-size:11.5px;color:#8B929C;text-align:center}

@media print{
  body{background:#fff;padding:0}
  header,.dock,.noprint,footer{display:none!important}
  .cardbox{border:1.5px solid #000;page-break-inside:avoid}
  .cardbox .head{background:#fff;color:#000;border-bottom:1.5px solid #000}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">실 습 용 응 용 프 로 그 램</div>
    <h1>AI 행정혁신 최고위 정책 워크숍</h1>
    <div class="sub">단체장 및 과장급 이상 간부 공무원 · 2시간</div>
    <div class="steps" id="steps"></div>
  </div>
</header>

<main><div class="wrap" id="stage"></div></main>

<div class="dock noprint">
  <div class="wrap">
    <button class="btn back" id="back" aria-label="이전 단계">‹</button>
    <button class="btn" id="next">시작하기</button>
  </div>
</div>

<script>
/* ═══════════ 상태 ═══════════ */
const S = {
  step:0,
  project:"",      // 사업명 1문장
  known:"",        // 참석자가 아는 사업 내용
  brief:"",        // AI가 작성한 사업계획 요약서
  edited:{},       // 단계별로 참석자가 수정한 질문지
  q:["",""],       // 0 의회 예상질의 / 1 앙상블 지목 질의
  ensemble:"",     // 4개 관점 산출 질의 전문
  scenario:"",     // 2년 후 성공·실패 기사
  decide:"",       // 성패를 가르는 결정사항
  mine:["","",""], // 소관 외 자료에 대한 본인 질의
  aiRaw:"",        // AI 산출 질의 원문
  read:"",         // 최종 선택된 확인 질의
  plan:""
};
const LAST = 10;

/* ═══════════ 기기 내 임시보관 ═══════════ */
const STORE_KEY="ai-policy-workshop";
let STORE_OK=true, RESTORED=false;
(function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
             catch(e){ STORE_OK=false; } })();

function save(){
  if(!STORE_OK) return;
  try{
    const {step,...rest}=S;
    localStorage.setItem(STORE_KEY, JSON.stringify({...rest, at:Date.now()}));
  }catch(e){ STORE_OK=false; }
}
function load(){
  if(!STORE_OK) return;
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    ["project","known","brief","ensemble","scenario","decide","aiRaw","read","plan"].forEach(k=>{ if(typeof d[k]==="string") S[k]=d[k]; });
    if(Array.isArray(d.q)) d.q.forEach((v,i)=>{ if(i<2) S.q[i]=v||""; });
    if(Array.isArray(d.mine)) d.mine.forEach((v,i)=>{ if(i<3) S.mine[i]=v||""; });
    if(d.edited && typeof d.edited==="object") S.edited=d.edited;
    RESTORED = !!(S.project||S.plan||S.scenario||S.q.some(v=>v)||S.mine.some(v=>v));
  }catch(e){}
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  S.project=S.known=S.brief=S.ensemble=S.scenario=S.decide=S.aiRaw=S.read=S.plan="";
  S.q=["",""]; S.mine=["","",""]; S.edited={};
  RESTORED=false;
}

/* ═══════════ 표준 프롬프트 ═══════════ */
const RULE =
`작성 기준
① 각 질문은 2문장 이내로 작성하고, 질문마다 해당 질문이 제기되는 사유를 1행으로 부기한다.
② 담당자가 즉답하기 어려운 순서로 배열한다.
③ 답변이나 대응 방안은 작성하지 아니한다.`;

function briefPrompt(){
  return `당신은 지방자치단체의 정책기획 담당자입니다.
아래 사업에 대하여 간부 보고용 사업계획 요약서를 2쪽 내외로 작성해 주십시오.

사업명 : ${S.project || "[사업명]"}
${S.known ? "\n담당자가 알고 있는 사항\n" + S.known + "\n" : ""}
구성
1. 사업개요 (사업기간, 총사업비, 재원분담, 대상 규모)
2. 추진근거
3. 추진현황
4. 예산 집행현황
5. 주요 현안 3건
6. 향후 추진계획
7. 검토가 필요한 사항

작성 기준
① 지방자치단체 내부 보고문서의 형식과 어투로 작성한다.
② 확인되지 않은 수치는 임의로 지어내지 말고 [ ] 로 비워 두어 담당자가 채우도록 한다.
③ 개조식으로 간결하게 작성한다.`;
}

const VIEWS = {
  // 관점별 지시문. 현재 사용되는 것은 council 하나이며,
  // 주민·감사·언론 세 관점은 ensemblePrompt() 에서 하나의 지시문으로 함께 부여한다.
  council:{
    who:"당신은 지방의회 의원입니다.",
    ask:"아래 사업에 대하여 행정사무감사에서 담당 과장에게 제기할 질문 5개를 작성해 주십시오.",
    v:["예산 산출의 근거","기존 사업과의 중복","읍·면 간 혜택의 형평","사업 종료 후 운영비와 지속 가능성","성과의 측정 방법"]}
};

function viewPrompt(role){
  const P = VIEWS[role];
  const views = P.v.map((v,i)=>`(${"가나다라마"[i]}) ${v}`).join(" ");
  const src = S.brief
    ? `\n[사업계획 요약서]\n${S.brief}\n`
    : `\n사업 : ${S.project || "[사업명 1문장]"}\n`;
  return `${P.who}\n${P.ask}\n${src}
다섯 개의 질문은 각각 다음 관점을 하나씩 담당합니다.
${views}

${RULE}`;
}

function briefBlock(){
  return S.brief ? `\n[사업계획 요약서]\n${S.brief}\n`
                 : `\n사업 : ${S.project || "[사업명 1문장]"}\n`;
}

function ensemblePrompt(){
  const done = S.q[0]
    ? `\n의회 관점의 예상 질의는 이미 도출하였습니다. 아래 질의와 중복되지 아니하도록 유의해 주십시오.\n[이미 도출된 의회 질의]\n${S.q[0]}\n`
    : `\n의회 관점의 예상 질의는 앞 단계에서 이미 도출하였으므로 본 단계에서는 제외합니다.\n`;
  return `당신은 세 사람의 역할을 동시에 수행합니다.
아래 사업에 대하여 각 입장에서 제기할 질문을 작성해 주십시오.
${briefBlock()}${done}
① 지역 주민(혜택에서 제외된 지역) — 우리 지역이 제외된 사유 / 접근성과 이용 조건 / 결정에 앞선 의견수렴 절차
② 자체감사 담당자 — 산출근거 문서의 구비 여부 / 계약 및 집행 절차 / 유사사업과의 중복
③ 지역 일간지 기자 — 발표 수치의 근거 / 수혜자가 특정될 여지 / 타 지방자치단체의 유사 실패 사례

작성 기준
① 입장별로 질문 3개씩, 모두 9개를 작성한다.
② 세 입장의 질문이 서로 중복되지 아니하도록 하며, 이미 도출된 의회 질의와도 겹치지 아니하도록 한다.
③ 각 질문은 2문장 이내로 작성한다.
④ 마지막에 '가장 먼저 대비하여야 할 질문' 1개를 지목하고 그 사유를 3행 이내로 밝힌다.
⑤ 답변이나 대응 방안은 작성하지 아니한다.`;
}

function concernBlock(){
  const parts=[];
  if(S.q[0]) parts.push("〈의회 관점〉\n"+S.q[0]);
  if(S.ensemble) parts.push("〈주민·감사·언론 관점〉\n"+S.ensemble);
  else if(S.q[1]) parts.push("〈주민·감사·언론 관점〉\n"+S.q[1]);
  return parts.length ? `\n[사전 기획 단계에서 제기되었던 우려]\n${parts.join("\n\n")}\n` : "";
}

function scenarioPrompt(){
  return `아래 사업에 대하여 2년 뒤의 상황을 두 가지로 가정하고, 각각을 지역 일간지 기사 형식으로 작성해 주십시오.
${briefBlock()}${concernBlock()}
[기사 1] 성공 — 이 사업이 성과를 거두어 타 지방자치단체의 벤치마킹 대상이 된 시점에서, 그 성공의 원동력을 분석한 기사
[기사 2] 실패 — 이 사업이 목표에 미치지 못하여 감사 지적과 언론 비판을 받은 시점에서, 그 실패의 원인을 분석한 기사

작성 기준
① 각 기사는 제목과 본문 400자 내외로 작성한다.
② 원인은 세 가지로 구분하여 제시하되, 위에 제시된 사전 우려와 연결하여 서술한다.
   - 성공 기사 : 어느 우려에 어떻게 대응하여 이를 극복하였는지
   - 실패 기사 : 어느 우려를 방치하여 그것이 현실이 되었는지
③ 원인은 경기 침체나 천재지변과 같은 외부 요인이 아니라, 담당 부서가 통제할 수 있었던 판단과 조치에서 찾는다.
④ 구체적인 수치와 장면을 포함하되, 가정된 상황임이 드러나도록 작성한다.
⑤ 두 기사는 동일한 사업에서 출발하되 결과가 갈린 경위가 드러나야 한다.`;
}

function backcastPrompt(){
  return `앞서 작성된 두 편의 기사는 다음과 같습니다.

[기사]
${S.scenario || "(작성된 기사를 붙여넣으십시오)"}

/* AI 산출 질의를 줄 단위로 분리 */
function splitQ(raw){
  return raw.split(/\n+/).map(s=>s.replace(/^[\s\-•*]*(?:[①②③④⑤]|\d+[.)])\s*/,"").trim())
            .filter(s=>s.length>4).slice(0,5);
}

      <div class="hint">여기에 붙여넣으신 우려가 제4세션의 시뮬레이션에 그대로 이어집니다. 사전에 제기된 우려에 어떻게 대응하였는가가 2년 뒤의 성패를 가르게 됩니다.</div>
      <textarea id="ens" rows="6" placeholder="산출된 질의 9건을 붙여넣으십시오">${esc(S.ensemble)}</textarea>

      <label class="field" for="qq">가장 먼저 대비하여야 할 질의 1건</label>
      <div class="hint">AI가 지목한 것을 그대로 쓰셔도 되고, 다르게 보시면 본인 판단으로 고르셔도 됩니다.</div>
      <textarea id="qq" rows="3" placeholder="질의 내용을 기재하십시오">${esc(S.q[1])}</textarea>
    </div>`; break;

  case 5:
    html=`<div class="stage">
      <div class="tag">제 4 세 션 · ①</div>
      <h2 class="title">정책 시뮬레이션<br><span class="sm">2년 후의 두 기사</span></h2>
      <div class="time">0:42 ~ 0:54</div>
      <p class="lead">시점을 2년 뒤로 옮깁니다. 같은 사업이 성공한 경우와 실패한 경우를 각각 지역 일간지 기사로 써 보게 하십시오. 결과만 전하는 기사가 아니라 <b>원동력과 원인을 분석하는 기사</b>여야 합니다. 앞 세션에서 나온 우려가 질문지에 함께 들어가므로, 그 우려에 어떻게 대응하였는가가 성패를 가르는 구조가 됩니다.</p>
      ${scriptBlock("scenario", scenarioPrompt())}
      <label class="field" for="scn">작성된 두 기사 붙여넣기</label>
      <div class="hint">다음 화면에서 이 기사를 근거로 결정사항을 역산하게 됩니다.</div>
      <textarea id="scn" rows="7" placeholder="성공 기사와 실패 기사를 함께 붙여넣으십시오">${esc(S.scenario)}</textarea>
    </div>`; break;

  case 6:
    html=`<div class="stage">
      <div class="tag">제 4 세 션 · ②</div>
      <h2 class="title">결정요인 역산</h2>
      <div class="time">0:54 ~ 1:02</div>
      <p class="lead">두 기사가 지목한 원인을 대조하여, 지금 확정하여야 할 사항을 뽑아냅니다. 같은 사안을 두 번 물어 답을 좁혀 가는 것이 실무에서 AI를 쓰는 방식입니다.</p>
      ${S.scenario?"":`<div class="warn">앞 화면에서 기사를 붙여넣지 않으셨습니다. 붙여넣으시면 질문지에 기사 전문이 포함됩니다.</div>`}
      <div class="panel"><h3>확인하실 사항</h3>
        <p class="cap">제3세션에서 제기된 우려가 제4세션의 시나리오를 거쳐 지금의 결정사항으로 되돌아옵니다. 우려를 확인하는 데서 그치지 아니하고 그 우려에 대한 대응을 결정으로 만드는 것이 오늘 실습의 마지막 단계입니다.</p></div>
      ${scriptBlock("backcast", backcastPrompt())}
      <label class="field" for="dc">성패를 가르는 결정사항 1건</label>
      <div class="hint">제시된 3가지 중 소관 부서에서 가장 시급하다고 보시는 것을 기재하십시오.</div>
      <textarea id="dc" rows="3" placeholder="결정사항을 기재하십시오">${esc(S.decide)}</textarea>
    </div>`; break;

  case 7:
    html=`<div class="stage">
      <div class="tag">제 5 세 션 · ①</div>
      <h2 class="title">소관 외 분야 자료 분석</h2>
      <div class="time">1:02 ~ 1:15</div>
      <p class="lead">이번에는 소관 사업을 사용하지 아니합니다. 아래 자료를 읽으시고, <b>AI를 쓰지 마시고</b> 담당자에게 확인할 질문 3개를 먼저 직접 작성해 보십시오.</p>
      <div class="panel"><h3>제시 자료 (표준 교보재)</h3>
        <div class="doc">${esc(REF_DOC)}</div>
      </div>
      <label class="field">직접 작성하신 확인 질의</label>
      <div class="hint">자료에 답이 나와 있지 않은 사항으로 고르십시오.</div>
      <textarea id="m0" rows="2" placeholder="1.">${esc(S.mine[0])}</textarea>
      <textarea id="m1" rows="2" style="margin-top:8px" placeholder="2.">${esc(S.mine[1])}</textarea>
      <textarea id="m2" rows="2" style="margin-top:8px" placeholder="3.">${esc(S.mine[2])}</textarea>
    </div>`; break;

  case 8: {
    const list = pickListHtml();
    html=`<div class="stage">
      <div class="tag">제 5 세 션 · ②</div>
      <h2 class="title">직접 작성한 질의와<br>AI 산출 질의의 비교</h2>
      <div class="time">1:15 ~ 1:27</div>
      <p class="lead">같은 자료를 AI에게도 읽혀 보시고, 직접 작성하신 질의와 비교해 보십시오.</p>
      ${scriptBlock("read", READ_PROMPT, "자료가 질문지에 함께 포함되어 있습니다. 그대로 복사하여 붙여넣으십시오.")}
      <label class="field" for="airaw">AI가 산출한 확인 질의 붙여넣기</label>
      <div class="hint">③번 항목의 질문 3개만 붙여넣으시면 아래에 선택지로 정리됩니다.</div>
      <textarea id="airaw" rows="5" placeholder="AI가 작성한 질문 3개를 붙여넣으십시오">${esc(S.aiRaw)}</textarea>
      <div class="hr"></div>
      <label class="field">담당자에게 확인할 질의 (1건 선택)</label>
      <div class="hint">직접 작성하신 것과 AI가 산출한 것 중 하나를 눌러 고르십시오. 선택하신 항목이 실습지에 기재되며, 다시 누르시면 변경됩니다.</div>
      <div id="picks">${list}</div>
    </div>`; break;
  }

  case 9:
    html=`<div class="stage">
      <div class="tag">제 6 세 션</div>
      <h2 class="title">안전한 활용 원칙</h2>
      <div class="time">1:27 ~ 1:40</div>
      <p class="lead">활용하지 아니하는 것이 안전한 것이 아니라, 안전하게 활용하는 기준을 조직이 정하여 두는 것이 안전한 것입니다.</p>
      <div class="panel"><h3>생성형 AI 활용 5대 원칙</h3>
        <ol class="list">
          <li><b>개인정보</b> — 실제 개인정보는 입력하지 아니한다. 필요한 경우 가명 또는 유형으로 대체한다.</li>
          <li><b>비공개 정보</b> — 비공개 행정정보는 외부 AI 입력에 앞서 보안성을 검토한다.</li>
          <li><b>사실 확인</b> — 산출 결과는 담당자가 원자료와 대조하여 확인한다.</li>
          <li><b>법령·조례</b> — 법령·조례·지침은 반드시 원문을 확인한다.</li>
          <li><b>최종 책임</b> — 판단과 책임은 생성형 AI가 아니라 공무원에게 있다.</li>
        </ol></div>
      <div class="panel"><h3>오늘 확인하신 것</h3>
        <p>요약서 작성 시 확인되지 않은 수치는 빈칸으로 두도록 하였고, 자료 분석 시 근거가 없는 사항은 '자료에 없음'으로 표시하도록 하였습니다. 지어내지 않도록 지시하는 것이 실무에서의 첫 번째 안전장치입니다.</p>
      </div>
    </div>`; break;

  case 10:
    html=`<div class="stage">
      <div class="tag">제 7 세 션</div>
      <h2 class="title">소회 및 실행 구상</h2>
      <div class="time">1:40 ~ 2:00</div>
      <p class="lead">오늘 얻으신 생각은 청사로 돌아가시면 곧 다른 업무에 묻힙니다. 잊히기 전에 지금 적어 두십시오. 제출하지 아니하며, 다듬어 쓰실 필요도 없습니다.</p>
      <div class="panel">
        <h3>정리하실 때 참고하실 사항</h3>
        <ul class="list">
          <li>오늘 가장 뜻밖이었던 것은 무엇이었습니까.</li>
          <li>우리 지역의 지속가능한 발전을 위하여, 그리고 소관 부서의 업무를 한 단계 높이기 위하여 무엇을 해 보시겠습니까.</li>
          <li>당장 다음 주에 시도해 보실 수 있는 것은 무엇입니까.</li>
        </ul>
      </div>
      <label class="field" for="pl">오늘의 생각</label>
      <div class="hint">본인께서 보관하실 기록입니다. 솔직하게 적으실수록 뒷날 도움이 됩니다.</div>
      <textarea id="pl" rows="9" placeholder="생각나시는 대로 적으십시오">${esc(S.plan)}</textarea>
      <div class="hr"></div>
      ${cardView()}
      <button class="btn ghost noprint" id="print">실습지 인쇄 · 저장</button>
      <button class="btn ghost noprint" id="clear" style="margin-top:9px">기재 내용 모두 지우기</button>
      <div class="note noprint">본 실습지는 제출하지 아니합니다. 본인께서 지참하시기 바랍니다.<br>${STORE_OK?"기재하신 내용은 이 기기에만 임시 보관됩니다. 공용 기기를 사용하신 경우 인쇄 후 지워 주십시오.":"이 브라우저에서는 임시 보관이 지원되지 아니합니다. 화면을 새로 고치면 기재 내용이 남지 아니합니다."}</div>
    </div>
    <footer>AI 행정혁신 최고위 정책 워크숍 · 실습용 응용프로그램</footer>`;
    nextLabel="처음으로"; break;
  }

  el.innerHTML=html;
  document.getElementById("next").textContent=nextLabel;
  document.getElementById("back").style.visibility = S.step===0?"hidden":"visible";
  document.getElementById("steps").innerHTML =
    Array.from({length:LAST},(_,i)=>`<i class="${i<S.step?(i===S.step-1?"on":"done"):""}"></i>`).join("");
  bind();
}

/* ═══════════ 상호작용 ═══════════ */
function regen(){
  const ta=document.getElementById("script");
  if(!ta) return;
  const key=ta.dataset.key;
  if(S.edited[key]!==undefined) return;   // 참석자가 고친 경우 덮어쓰지 않음
  ta.value = key==="brief"    ? briefPrompt()
           : key==="read"     ? READ_PROMPT
           : key==="ensemble" ? ensemblePrompt()
           : key==="scenario" ? scenarioPrompt()
           : key==="backcast" ? backcastPrompt()
           : viewPrompt(key);
}

function bind(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id); if(e) e.addEventListener(ev,fn);};

  on("proj","input",e=>{S.project=e.target.value.trim(); regen();});
  on("known","input",e=>{S.known=e.target.value.trim(); regen();});
  on("brief","input",e=>{S.brief=e.target.value.trim(); regen();});
  on("qq","input",e=>{S.q[S.step===3?0:1]=e.target.value;});
  on("pl","input",e=>{
    S.plan=e.target.value;
    const t=document.getElementById("planSlot");
    if(t){t.textContent=S.plan||"미기재"; t.className="v"+(S.plan?"":" empty");}
  });
  ["m0","m1","m2"].forEach((id,i)=>on(id,"input",e=>{S.mine[i]=e.target.value;}));
  on("airaw","input",e=>{S.aiRaw=e.target.value; refreshPicks();});
  on("ens","input",e=>{S.ensemble=e.target.value.trim();});
  on("scn","input",e=>{S.scenario=e.target.value.trim(); regen();});
  on("dc","input",e=>S.decide=e.target.value);

  const sc=document.getElementById("script");
  if(sc) sc.addEventListener("input",()=>{
    S.edited[sc.dataset.key]=sc.value;
    const r=document.getElementById("reset"); if(r) r.disabled=false;
  });

  on("copy","click",()=>{
    const ta=document.getElementById("script");
    copyText(ta.value);
    const m=document.getElementById("copied");
    if(m){m.classList.add("show"); setTimeout(()=>m.classList.remove("show"),2600);}
  });
  const rs=document.getElementById("reset");
  if(rs){
    const key=document.getElementById("script").dataset.key;
    rs.disabled = S.edited[key]===undefined;
    rs.addEventListener("click",()=>{
      const ta=document.getElementById("script");
      delete S.edited[ta.dataset.key];
      regen(); rs.disabled=true;
      const m=document.getElementById("copied");
      if(m){ m.textContent="고치신 내용을 취소하고 원래 질문지로 되돌렸습니다.";
             m.classList.add("show");
             setTimeout(()=>{m.classList.remove("show");
               setTimeout(()=>m.textContent="복사되었습니다. AI 화면에 붙여넣으십시오.",300);},2600); }
    });
  }
  document.querySelectorAll("[data-ai]").forEach(b=>
    b.addEventListener("click",()=>window.open(b.dataset.ai,"_blank","noopener")));
  on("print","click",()=>window.print());
  on("clear","click",()=>{
    if(confirm("기재하신 내용을 모두 지웁니다. 계속하시겠습니까?")){ clearStore(); S.step=0; render(); }
  });
  bindPicks();
}

let PICKS=[];
function buildPicks(){
  PICKS=[
    ...S.mine.filter(v=>v.trim()).map(v=>({src:"직접 작성",v:v.trim()})),
    ...splitQ(S.aiRaw).map(v=>({src:"AI 산출",v}))
  ];
  /* 선택하지 않으신 경우 첫 항목이 기본으로 기재되도록 한다 */
  if(PICKS.length && !PICKS.some(o=>o.v===S.read)) S.read=PICKS[0].v;
  if(!PICKS.length) S.read="";
  return PICKS;
}
function pickListHtml(){
  const opts=buildPicks();
  return opts.length
    ? opts.map((o,i)=>`<div class="pick ${S.read===o.v?"sel":""}" data-pick="${i}">
        <span class="src">${o.src}</span>${esc(o.v)}</div>`).join("")
    : `<p class="cap">직접 작성하신 질의도, AI 산출 질의도 아직 없습니다. 앞 화면에서 질의를 작성하시거나 AI 결과를 붙여넣으십시오.</p>`;
}
function refreshPicks(){
  const box=document.getElementById("picks");
  if(!box) return;
  box.innerHTML=pickListHtml();
  bindPicks();
}
function bindPicks(){
  document.querySelectorAll("[data-pick]").forEach(p=>{
    p.addEventListener("click",()=>{
      const o=PICKS[Number(p.dataset.pick)];
      if(!o) return;
      S.read=o.v;
      document.querySelectorAll("[data-pick]").forEach(x=>x.classList.remove("sel"));
      p.classList.add("sel");
      save();
    });
  });
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).catch(()=>fallback(text));
  } else fallback(text);
}
function fallback(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}

document.getElementById("next").addEventListener("click",()=>{
  if(S.step===2 && !S.project){
    const t=document.getElementById("proj");
    t.focus(); t.style.borderColor="var(--seal)"; return;
  }
  save();
  S.step = S.step>=LAST ? 0 : S.step+1;
  window.scrollTo({top:0}); render();
});
document.getElementById("back").addEventListener("click",()=>{
  if(S.step>0){ save(); S.step--; window.scrollTo({top:0}); render(); }
});

let saveTimer=null;
document.addEventListener("input",()=>{
  clearTimeout(saveTimer); saveTimer=setTimeout(save,400);
});
window.addEventListener("beforeunload",save);

load();
render();
</script>
</body>
</html>
